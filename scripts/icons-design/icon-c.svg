<!-- 方案 C：极简扁平 - 纯绿底 + 白色"读"字变形书本 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#bgC)"/>
  <!-- 白色书本（变形为"读"的意象：言字旁+书页） -->
  <!-- 左页 -->
  <path d="M32 36 H54 V92 H40 Q32 92 32 84 Z" fill="#FFFFFF"/>
  <!-- 右页 -->
  <path d="M96 36 H74 V92 H88 Q96 92 96 84 Z" fill="#FFFFFF"/>
  <!-- 书脊/中缝 -->
  <path d="M54 36 Q64 32 74 36 V92 Q64 88 54 92 Z" fill="#E5F7EE"/>
  <!-- 言字旁点（阅读的眼睛/言） -->
  <circle cx="64" cy="54" r="5" fill="#07C160"/>
  <line x1="64" y1="59" x2="64" y2="72" stroke="#07C160" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 书页横纹 -->
  <line x1="38" y1="50" x2="50" y2="50" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="58" x2="48" y2="58" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="90" y2="50" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="58" x2="88" y2="58" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
</svg>
